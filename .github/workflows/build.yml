name: Build and push to AWS

on:
  push:
    branches: ['dev']
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_VERSION: ${{ github.event_name == 'release' && 'release' || 'dev' }}
  # LibreWXR source the Pirate Weather LibreWXR image is built on: the fork
  # branch carrying the hooks and snapshot sync until they are upstream, then
  # JoshuaKimsey/LibreWXR at a release tag.
  LIBREWXR_REPO: Pirate-Weather/LibreWXR
  LIBREWXR_REF: network-split
  RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

#################################################################
# INGEST IMAGE BUILD (Native Builds on ARM and x64 nodes)
#################################################################

jobs:
  ingest_arm:
    name: Build Ingest Image (ARM)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public (ARM)
        id: login-ingest-arm
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push Ingest ARM image
        env:
          REGISTRY: ${{ steps.login-ingest-arm.outputs.registry }}
          REGISTRY_ALIAS: j9v4j3c7  # Replace with your registry alias
          REPOSITORY: pirate-wgrib-python-arm   # Use a base name without an arch suffix
          IMAGE_TAG: ${{ env.IMAGE_VERSION }}-arm64
        run: |
          docker build -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG -f Docker/pirate-ingest-dockerfile .
          docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG
          if [ -n "$RELEASE_VERSION" ]; then
            docker tag $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG \
              $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION-arm64
            docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION-arm64
          fi

  ingest_x64:
    name: Build Ingest Image (x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public (x64)
        id: login-ingest-x64
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push Ingest x64 image
        env:
          REGISTRY: ${{ steps.login-ingest-x64.outputs.registry }}
          REGISTRY_ALIAS: j9v4j3c7
          REPOSITORY: pirate-wgrib-python-arm
          IMAGE_TAG: ${{ env.IMAGE_VERSION }}-amd64
        run: |
          docker build -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG -f Docker/pirate-ingest-dockerfile .
          docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG
          if [ -n "$RELEASE_VERSION" ]; then
            docker tag $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG \
              $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION-amd64
            docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION-amd64
          fi

  manifest_ingest:
    name: Create Ingest MultiArch Manifest
    needs: [ingest_arm, ingest_x64]
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public (Manifest Ingest)
        id: login-manifest-ingest
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Create and push manifest for Ingest image
        env:
          REGISTRY: ${{ steps.login-manifest-ingest.outputs.registry }}
          REGISTRY_ALIAS: j9v4j3c7
          REPOSITORY: pirate-wgrib-python-arm
          IMAGE_TAG: ${{ env.IMAGE_VERSION }}
        run: |
          docker buildx imagetools create -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:${{ env.IMAGE_VERSION }}-amd64 \
            $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:${{ env.IMAGE_VERSION }}-arm64
            
          if [ -n "$RELEASE_VERSION" ]; then
            docker buildx imagetools create -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION \
              $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION-amd64 \
              $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$RELEASE_VERSION-arm64
          fi

