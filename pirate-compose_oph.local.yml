# Single-server Pirate Weather v3 stack: every ingest on a schedule, writing local
# stores (save_type=Download), and the API serving them.
#
# Storage (set in .env, see .env.example):
#   PW_PROD_ROOT  published stores, read by the API. Put it on the fastest disk.
#                 Every ingest publishes into the same /data/Prod/v32 folder,
#                 because the API reads all <MODEL>.current.json pointers from
#                 one directory. publish_store writes the root zarr.json last,
#                 then the pointer, and keeps the newest two versions.
#   PW_WORK_ROOT  scratch space, one <MODEL> folder per ingest (each ingest wipes
#                 its own folder at start and end, so they must not be shared).
#                 Put it on a fast local disk: GDPS re-reads its ~31 GB merged
#                 NetCDF many times while writing its store, and on a network
#                 block volume that took 90 min instead of 40. Peak use is
#                 tens of GB per heavy model (GDPS ~40 GB).
#   PW_BULK_WORK_ROOT  scratch for GFS, URMA and ECMWF (GFS ~40 GB, URMA ~21 GB), which
#                 do not re-read it like GDPS. On one server, GFS, GDPS and URMA
#                 overlapping on the same disk as PW_PROD_ROOT filled it, so put
#                 this on a larger disk; it defaults to PW_WORK_ROOT.
#   PW_HIST_ROOT  short-term history stores, Hist/<MODEL>; a larger, slower disk
#                 is fine because each ingest copies the stores it needs into
#                 its work folder before merging.
#
# Start-up:
#   docker compose -f pirate-compose_oph.local.yml --profile ingest create
#   docker compose -f pirate-compose_oph.local.yml up -d
# The ingest services are in the "ingest" profile so a plain `up` does not start
# all 27 at once (their combined peak memory is far above one server's).
# `create` makes their containers; Ofelia starts them on the schedule below.
# After rebuilding pirateingest:latest, run the `create` again to recreate them.

x-ingest: &ingest
  image: pirateingest:latest
  profiles: ["ingest"]
  dns:
    - 1.1.1.1
    - 8.8.8.8
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  volumes:
    - ${PW_PROD_ROOT:?set PW_PROD_ROOT in .env}:/data/Prod
    - ${PW_HIST_ROOT:?set PW_HIST_ROOT in .env}:/data/Hist
    - ${PW_WORK_ROOT:?set PW_WORK_ROOT in .env}:/work
    - ${PW_BULK_WORK_ROOT:-${PW_WORK_ROOT}}:/work-bulk

x-ingest-env: &ingest_env
  save_type: "Download"
  forecast_path: "/data/Prod"
  wgrib2_path: "/build/wgrib2_build/bin/wgrib2"
  nomads_request_interval_seconds: "${nomads_request_interval_seconds:-1}"
  herbie_download_retries: "${herbie_download_retries:-3}"
  herbie_retry_sleep_seconds: "${herbie_retry_sleep_seconds:-20}"

services:
  # Read-only forecast API. It writes reader heartbeats to /data/v31/.readers,
  # so the mount must be writable. ETOPO_DA_C.zarr is not produced by any
  # ingest; without it elevation is reported as 0.
  api:
    image: pirateapi:latest
    container_name: pirate-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${PW_PROD_ROOT}:/data
    environment:
      STAGE: "PROD"
      save_dir: "/data/v31"
      use_etopo: "${use_etopo:-false}"
    command: ["API.responseLocal:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  # LibreWXR data pipeline (radar, nowcast) for the minutely block. Unlike the
  # ingests it runs continuously and is not scheduled by Ofelia: after each
  # nowcast (every ~10 min) LibreWXR's nowcast hook runs
  # ingest/LibreWXR_Local_Ingest.py in this container, which publishes
  # LibreWXR.zarr into /data/Prod/v32 like any other ingest. Only the pipeline
  # runs here; no LibreWXR tile renderer is started. Optional, in the
  # "librewxr" profile: without it the minutely block uses the models only.
  #   docker compose -f pirate-compose_oph.local.yml --profile librewxr up -d librewxr
  # Image: Docker/pirate-librewxr-dockerfile on the Pirate-Weather/LibreWXR fork
  # (branch network-split, which adds the hooks):
  #   docker build -t librewxr-base:local <LibreWXR checkout>
  #   docker build -f Docker/pirate-librewxr-dockerfile \
  #       --build-arg LIBREWXR_IMAGE=librewxr-base:local -t pirate-librewxr:latest .
  # Measured on one server: ~7 GB pipeline RSS plus a 3.5 GB export peak, one
  # cycle ~60 s, cache ~5 GB rewritten every 10 minutes.
  librewxr:
    image: pirate-librewxr:latest
    container_name: pirate-librewxr
    profiles: ["librewxr"]
    restart: unless-stopped
    command: ["python", "-m", "librewxr.data_pipeline"]
    mem_limit: 14g
    # Docker's default 64 MiB /dev/shm is too small for LibreWXR's per-cycle
    # stores (an exhausted memmap fill dies with SIGBUS).
    shm_size: "2g"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    volumes:
      - ${PW_PROD_ROOT:?set PW_PROD_ROOT in .env}:/data/Prod
      - ${PW_WORK_ROOT:?set PW_WORK_ROOT in .env}:/work
      # LibreWXR's own cache (radar frames, nowcast, NWP). It is rewritten
      # every cycle, so a fast local disk; defaults to a folder in PW_WORK_ROOT.
      - ${PW_LIBREWXR_CACHE_ROOT:-${PW_WORK_ROOT}/LibreWXR_cache}:/data/librewxr-cache
      # earthkit-regrid's interpolation matrices (the IFS O1280 grid). A fresh
      # container downloads them on first use and fails those IFS timesteps.
      - librewxr-earthkit:/root/.cache/earthkit-regrid
    environment:
      LIBREWXR_CACHE_DIR: "/data/librewxr-cache"
      # Empty: log to stdout only (docker logs), not a file in the image
      LIBREWXR_LOG_FILE: ""
      LIBREWXR_LOG_LEVEL: "INFO"
      LIBREWXR_ENABLED_REGIONS: "ALL"
      LIBREWXR_NOWCAST_FRAMES: "9"
      # The export uses radar only, but these match the tested setup; NWP fills
      # the nowcast flow outside radar coverage (LibreWXR defaults are "ifs").
      LIBREWXR_NA_NWP_SOURCE: "hrrr"
      LIBREWXR_EU_NWP_PROFILE: "dini_with_icon_eu"
      LIBREWXR_HOOK_NOWCAST_CMD: "python3 /app/ingest/LibreWXR_Local_Ingest.py"
      LIBREWXR_HOOK_TIMEOUT: "540"
      save_type: "Download"
      forecast_path: "/data/Prod"
      forecast_process_dir: "/work/LibreWXR"
      zarr_store_workers: "4"

  # Scheduler. Schedules are UTC with a leading seconds field. Times follow the
  # production pipeline table (docs.pirateweather.net, DataSources "Data
  # Pipeline"): each model's run time plus the delay until its data is posted.
  # RTMA, AIGEFS and the two alert jobs are not in that table. Every ingest exits
  # early ("No Update") when its newest cycle is already published.
  # On one server the heavy jobs can overlap (e.g. at 05:00 GFS, AIGFS, GDPS and
  # DWD start while the 04:45 NBM is still running); the mem_limit on each ingest
  # keeps one job's peak from taking the whole host.
  ofelia:
    image: mcuadros/ofelia:0.3.22
    container_name: ofelia
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      ofelia.enabled: "true"
      # NOAA
      ofelia.job-run.gfs.schedule: "0 0 5,11,17,23 * * *"
      ofelia.job-run.gfs.container: "pirate-ingest-gfs"
      ofelia.job-run.gfs.no-overlap: "true"
      ofelia.job-run.gefs.schedule: "0 0 1,7,13,19 * * *"
      ofelia.job-run.gefs.container: "pirate-ingest-gefs"
      ofelia.job-run.gefs.no-overlap: "true"
      ofelia.job-run.aigfs.schedule: "0 0 5,11,17,23 * * *"
      ofelia.job-run.aigfs.container: "pirate-ingest-aigfs"
      ofelia.job-run.aigfs.no-overlap: "true"
      ofelia.job-run.aigefs.schedule: "0 20 2,8,14,20 * * *"
      ofelia.job-run.aigefs.container: "pirate-ingest-aigefs"
      ofelia.job-run.aigefs.no-overlap: "true"
      ofelia.job-run.nbm.schedule: "0 45 * * * *"
      ofelia.job-run.nbm.container: "pirate-ingest-nbm"
      ofelia.job-run.nbm.no-overlap: "true"
      ofelia.job-run.hrrr.schedule: "0 45 * * * *"
      ofelia.job-run.hrrr.container: "pirate-ingest-hrrr"
      ofelia.job-run.hrrr.no-overlap: "true"
      ofelia.job-run.hrrr6h.schedule: "0 30 2,8,14,20 * * *"
      ofelia.job-run.hrrr6h.container: "pirate-ingest-hrrr6h"
      ofelia.job-run.hrrr6h.no-overlap: "true"
      ofelia.job-run.subh.schedule: "0 45 * * * *"
      ofelia.job-run.subh.container: "pirate-ingest-subh"
      ofelia.job-run.subh.no-overlap: "true"
      # RRFS (served only for include=rrfs). Posting is irregular on AWS (cycles
      # arrive hours late or not at all, and the ingests fall back to NOMADS),
      # and each ingest takes the newest cycle whose last lead exists, so all
      # five check hourly; runs that find nothing new exit early.
      ofelia.job-run.rrfs.schedule: "0 50 * * * *"
      ofelia.job-run.rrfs.container: "pirate-ingest-rrfs"
      ofelia.job-run.rrfs.no-overlap: "true"
      ofelia.job-run.rrfs-subh.schedule: "0 50 * * * *"
      ofelia.job-run.rrfs-subh.container: "pirate-ingest-rrfs-subh"
      ofelia.job-run.rrfs-subh.no-overlap: "true"
      ofelia.job-run.rrfs-na.schedule: "0 50 * * * *"
      ofelia.job-run.rrfs-na.container: "pirate-ingest-rrfs-na"
      ofelia.job-run.rrfs-na.no-overlap: "true"
      ofelia.job-run.rrfs6h.schedule: "0 20 * * * *"
      ofelia.job-run.rrfs6h.container: "pirate-ingest-rrfs6h"
      ofelia.job-run.rrfs6h.no-overlap: "true"
      ofelia.job-run.rrfs-na6h.schedule: "0 20 * * * *"
      ofelia.job-run.rrfs-na6h.container: "pirate-ingest-rrfs-na6h"
      ofelia.job-run.rrfs-na6h.no-overlap: "true"
      ofelia.job-run.rtma-ru.schedule: "0 10,25,40,55 * * * *"
      ofelia.job-run.rtma-ru.container: "pirate-ingest-rtma-ru"
      ofelia.job-run.rtma-ru.no-overlap: "true"
      # RTMA analyses are posted about 50 min after valid time; URMA several hours.
      ofelia.job-run.rtma.schedule: "0 55 * * * *"
      ofelia.job-run.rtma.container: "pirate-ingest-rtma"
      ofelia.job-run.rtma.no-overlap: "true"
      ofelia.job-run.urma.schedule: "0 15 * * * *"
      ofelia.job-run.urma.container: "pirate-ingest-urma"
      ofelia.job-run.urma.no-overlap: "true"
      ofelia.job-run.nws-alerts.schedule: "0 0,30 * * * *"
      ofelia.job-run.nws-alerts.container: "pirate-ingest-nws-alerts"
      ofelia.job-run.nws-alerts.no-overlap: "true"
      # ECMWF open data. The 0.1 degree ensemble reaches 240 h on AWS about 10 h after
      # the run (09:56 UTC for 00Z on 2026-11-04), about 1.7 h later than at 0.25 degrees.
      ofelia.job-run.ecmwf.schedule: "0 30 10,22 * * *"
      ofelia.job-run.ecmwf.container: "pirate-ingest-ecmwf"
      ofelia.job-run.ecmwf.no-overlap: "true"
      ofelia.job-run.ecmwf-aifs.schedule: "0 0 2,8,14,20 * * *"
      ofelia.job-run.ecmwf-aifs.container: "pirate-ingest-ecmwf-aifs"
      ofelia.job-run.ecmwf-aifs.no-overlap: "true"
      # MSC Datamart: each ingest looks for the newest run that is complete.
      ofelia.job-run.gdps.schedule: "0 0 5,17 * * *"
      ofelia.job-run.gdps.container: "pirate-ingest-gdps"
      ofelia.job-run.gdps.no-overlap: "true"
      ofelia.job-run.geps.schedule: "0 0 7,19 * * *"
      ofelia.job-run.geps.container: "pirate-ingest-geps"
      ofelia.job-run.geps.no-overlap: "true"
      ofelia.job-run.hrdps.schedule: "0 0 4,10,16,22 * * *"
      ofelia.job-run.hrdps.container: "pirate-ingest-hrdps"
      ofelia.job-run.hrdps.no-overlap: "true"
      ofelia.job-run.reps.schedule: "0 0 4,10,16,22 * * *"
      ofelia.job-run.reps.container: "pirate-ingest-reps"
      ofelia.job-run.reps.no-overlap: "true"
      ofelia.job-run.raqdps.schedule: "0 15 4,16 * * *"
      ofelia.job-run.raqdps.container: "pirate-ingest-raqdps"
      ofelia.job-run.raqdps.no-overlap: "true"
      # Other sources
      ofelia.job-run.dwd-mosmix.schedule: "0 0 * * * *"
      ofelia.job-run.dwd-mosmix.container: "pirate-ingest-dwd-mosmix"
      ofelia.job-run.dwd-mosmix.no-overlap: "true"
      # FMI posts each 00Z SILAM cycle about 37 h later: near 12:55 UTC the next day, on
      # some days near 17:50 (21 days to 2026-11-04). A run with nothing new exits in ~3 s.
      ofelia.job-run.silam.schedule: "0 0 14,19 * * *"
      ofelia.job-run.silam.container: "pirate-ingest-silam"
      ofelia.job-run.silam.no-overlap: "true"
      ofelia.job-run.wmo-alerts.schedule: "0 15 * * * *"
      ofelia.job-run.wmo-alerts.container: "pirate-ingest-wmo-alerts"
      ofelia.job-run.wmo-alerts.no-overlap: "true"
      # Nothing else deletes old history stores. Each ingest only reads the
      # stores inside its HISTORY_PERIODS window (API/constants/shared_const.py),
      # so anything older than the window plus a 2-day margin is unused:
      # GFS 288 h + 48 h = 20160 min, URMA 282 h + 48 h = 19800 min,
      # RTMA / ECMWF / SILAM 48 h + 48 h = 5760 min.
      ofelia.job-run.prune-history.schedule: "0 50 0 * * *"
      ofelia.job-run.prune-history.image: "busybox:1.37"
      ofelia.job-run.prune-history.volume: '["${PW_HIST_ROOT}:/hist:rw"]'
      ofelia.job-run.prune-history.command: >-
        sh -c 'find /hist/GFS -maxdepth 1 -name "GFS_Hist_*.zarr" -mmin +20160 -exec rm -rf {} + ;
        find /hist/URMA -maxdepth 1 -name "URMA_Hist_*.zarr" -mmin +19800 -exec rm -rf {} + ;
        find /hist/RTMA -maxdepth 1 -name "RTMA_Hist_*.zarr" -mmin +5760 -exec rm -rf {} + ;
        find /hist/ECMWF -maxdepth 1 -name "ECMWF_Hist_*.zarr" -mmin +5760 -exec rm -rf {} + ;
        find /hist/SILAM -maxdepth 1 -name "SILAM_Hist_*.zarr" -mmin +5760 -exec rm -rf {} + ;
        true'
      ofelia.job-run.prune-history.no-overlap: "true"

  # ------------------------------------------------------------------------
  # Ingests. zarr_store_workers is set explicitly: peak memory scales with
  # write threads (about one shard each), and several scripts default to
  # os.cpu_count() or 64. mem_limit is the measured peak plus headroom
  # (Notes/STORAGE_AND_READ_BENCHMARKS.md).
  # ------------------------------------------------------------------------

  # NOAA
  gfs_ingest:
    <<: *ingest
    container_name: pirate-ingest-gfs
    mem_limit: 10g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work-bulk/GFS"
      historic_path: "/data/Hist/GFS"
      zarr_store_workers: "4"
    command: ["ingest/GFS_Local_Ingest.py"]

  gefs_ingest:
    <<: *ingest
    container_name: pirate-ingest-gefs
    mem_limit: 12g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/GEFS"
      zarr_store_workers: "2"
    command: ["ingest/GEFS_Local_Ingest.py"]

  aigfs_ingest:
    <<: *ingest
    container_name: pirate-ingest-aigfs
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/AIGFS"
      zarr_store_workers: "2"
    command: ["ingest/AIGFS_Local_Ingest.py"]

  aigefs_ingest:
    <<: *ingest
    container_name: pirate-ingest-aigefs
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/AIGEFS"
      zarr_store_workers: "2"
    command: ["ingest/AIGEFS_Local_Ingest.py"]

  nbm_ingest:
    <<: *ingest
    container_name: pirate-ingest-nbm
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/NBM"
      zarr_store_workers: "4"
      # wgrib2 interpolation uses OpenMP; keep BLAS single-threaded alongside it.
      OMP_NUM_THREADS: "8"
      OMP_PROC_BIND: "spread"
      OMP_PLACES: "cores"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      herbie_max_threads: "1"
    command: ["ingest/NBM_Local_Ingest.py"]

  hrrr_ingest:
    <<: *ingest
    container_name: pirate-ingest-hrrr
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/HRRR"
      zarr_store_workers: "2"
    command: ["ingest/HRRR_Local_Ingest.py"]

  hrrr_6h_ingest:
    <<: *ingest
    container_name: pirate-ingest-hrrr6h
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/HRRR_6H"
      zarr_store_workers: "2"
    command: ["ingest/HRRR_6H_Local_Ingest.py"]

  subh_ingest:
    <<: *ingest
    container_name: pirate-ingest-subh
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/SubH"
      zarr_store_workers: "2"
    command: ["ingest/SubH_Local_Ingest.py"]

  # RRFS: measured peaks with 4 write threads were 1.5 GB (hourly, NA,
  # sub-hourly) and 3.4 GB (6-hourly, NA 6-hourly); these run with 2.
  rrfs_ingest:
    <<: *ingest
    container_name: pirate-ingest-rrfs
    mem_limit: 4g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RRFS"
      zarr_store_workers: "2"
    command: ["ingest/RRFS_Local_Ingest.py"]

  rrfs_6h_ingest:
    <<: *ingest
    container_name: pirate-ingest-rrfs6h
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RRFS_6H"
      zarr_store_workers: "2"
    command: ["ingest/RRFS_6H_Local_Ingest.py"]

  rrfs_subh_ingest:
    <<: *ingest
    container_name: pirate-ingest-rrfs-subh
    mem_limit: 4g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RRFS_SubH"
      zarr_store_workers: "2"
    command: ["ingest/RRFS_SubH_Local_Ingest.py"]

  rrfs_na_ingest:
    <<: *ingest
    container_name: pirate-ingest-rrfs-na
    mem_limit: 4g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RRFS_NA"
      zarr_store_workers: "2"
    command: ["ingest/RRFS_NA_Local_Ingest.py"]

  rrfs_na_6h_ingest:
    <<: *ingest
    container_name: pirate-ingest-rrfs-na6h
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RRFS_NA_6H"
      zarr_store_workers: "2"
    command: ["ingest/RRFS_NA_6H_Local_Ingest.py"]

  rtma_ru_ingest:
    <<: *ingest
    container_name: pirate-ingest-rtma-ru
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RTMA_RU"
      zarr_store_workers: "2"
    command: ["ingest/RTMA-RU_Local_Ingest.py"]

  rtma_ingest:
    <<: *ingest
    container_name: pirate-ingest-rtma
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RTMA"
      historic_path: "/data/Hist/RTMA"
      zarr_store_workers: "8"
    command: ["ingest/RTMA_Local_Ingest.py"]

  # URMA publishes its merged history as URMA_Hist into /data/Prod/v32.
  urma_ingest:
    <<: *ingest
    container_name: pirate-ingest-urma
    mem_limit: 12g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work-bulk/URMA"
      historic_path: "/data/Hist/URMA"
      zarr_store_workers: "8"
    command: ["ingest/URMA_Local_Ingest.py"]

  nws_alerts_ingest:
    <<: *ingest
    container_name: pirate-ingest-nws-alerts
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/NWS_Alerts"
      historic_path: "/data/Hist/NWS_Alerts"
    command: ["ingest/NWS_Alerts_Local.py"]

  # ECMWF open data
  ecmwf_ingest:
    <<: *ingest
    container_name: pirate-ingest-ecmwf
    mem_limit: 11g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work-bulk/ECMWF"
      historic_path: "/data/Hist/ECMWF"
      zarr_store_workers: "4"
    command: ["ingest/ECMWF_Local_Ingest.py"]

  ecmwf_aifs_ingest:
    <<: *ingest
    container_name: pirate-ingest-ecmwf-aifs
    mem_limit: 10g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/ECMWF_AIFS"
      zarr_store_workers: "2"
    command: ["ingest/ECMWF_AIFS_Local_Ingest.py"]

  # MSC Datamart
  gdps_ingest:
    <<: *ingest
    container_name: pirate-ingest-gdps
    mem_limit: 10g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/GDPS"
      zarr_store_workers: "2"
    command: ["ingest/GDPS_Local_Ingest.py"]

  geps_ingest:
    <<: *ingest
    container_name: pirate-ingest-geps
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/GEPS"
      zarr_store_workers: "2"
    command: ["ingest/GEPS_Local_Ingest.py"]

  hrdps_ingest:
    <<: *ingest
    container_name: pirate-ingest-hrdps
    mem_limit: 8g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/HRDPS"
      zarr_store_workers: "2"
    command: ["ingest/HRDPS_Local_Ingest.py"]

  reps_ingest:
    <<: *ingest
    container_name: pirate-ingest-reps
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/REPS"
      zarr_store_workers: "2"
    command: ["ingest/REPS_Local_Ingest.py"]

  raqdps_ingest:
    <<: *ingest
    container_name: pirate-ingest-raqdps
    mem_limit: 6g
    environment:
      <<: *ingest_env
      forecast_process_dir: "/work/RAQDPS"
      zarr_store_workers: "2"
